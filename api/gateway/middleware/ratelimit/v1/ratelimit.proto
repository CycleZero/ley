syntax = "proto3";

package gateway.middleware.ratelimit.v1;

option go_package = "github.com/CycleZero/ley/api/gateway/middleware/ratelimit/v1;v1";

import "google/protobuf/duration.proto";

message RateLimit {
  message Rule {
    // 匹配路径模式，支持通配符 "*" 匹配所有路径
    string pattern = 1;
    // 窗口时间内允许的最大请求数
    int64 max_requests = 2;
    // 时间窗口
    google.protobuf.Duration window = 3;
    // 限流维度: "ip" | "user" | "ip,user"
    string key_by = 4;
  }

  // Redis 地址
  string redis_addr = 1;
  string redis_password = 2;
  int32 redis_db = 3;

  // 限流规则列表（按顺序匹配，命中第一个规则后停止）
  repeated Rule rules = 4;

  // 超过限制时返回的 HTTP 状态码，默认 429
  int32 limit_status_code = 5;

  // 超过限制时的提示消息
  string limit_message = 6;
}
