# ================================
# Ley 博客平台 Docker Compose 配置
# ================================
# 使用 host 网络模式
#
# 使用方法:
#   docker-compose build          # 构建所有服务
#   docker-compose up -d           # 启动所有服务
#   docker-compose logs -f auth    # 查看 auth 服务日志
#   docker-compose down            # 停止所有服务
# ================================

services:
  # ================================
  # Auth 服务 — :9001 (gRPC) / :8001 (HTTP)
  # ================================
  auth:
    image: ghcr.io/cyclezero/ley/ley-auth:latest
    container_name: ley-auth
    network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

  # ================================
  # Blog 服务 — :9002 (gRPC) / :8002 (HTTP)
  # ================================
  blog:
    image: ghcr.io/cyclezero/ley/ley-blog:latest
    container_name: ley-blog
    network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

  # ================================
  # Entry 入口服务 — Gin 统一入口（T14：gateway 已退役，唯一 HTTP 入口 :8000）
  # ================================
  # entry 监听端口由本地引导配置 data/entry/configs/config.yaml 的
  # server.http.addr 决定（默认 0.0.0.0:8000）。
  entry:
    image: ghcr.io/cyclezero/ley/ley-entry:latest
    container_name: ley-entry
    network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    depends_on:
      - auth
      - blog
