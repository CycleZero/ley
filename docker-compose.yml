# ================================
# Ley 博客平台 Docker Compose 配置
# ================================
# 使用 host 网络模式
#
# 使用方法:
#   docker-compose build          # 构建所有服务
#   docker-compose up -d           # 启动所有服务
#   docker-compose logs -f auth    # 查看 auth 服务日志
#   docker-compose down            # 停止所有服务
# ================================

services:
  # ================================
  # Gateway — API 网关 :8000
  # ================================
  gateway:
    image: ghcr.io/cyclezero/ley/ley-gateway:latest
    container_name: ley-gateway
    network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    depends_on:
      - auth
      - blog
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: '512M'

  # ================================
  # Auth 服务 — :9001 (gRPC) / :8001 (HTTP)
  # ================================
  auth:
    image: ghcr.io/cyclezero/ley/ley-auth:latest
    container_name: ley-auth
    network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

  # ================================
  # Blog 服务 — :9002 (gRPC) / :8002 (HTTP)
  # ================================
  blog:
    image: ghcr.io/cyclezero/ley/ley-blog:latest
    container_name: ley-blog
    network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

  # ================================
  # Entry 入口服务 — Gin 统一入口（T13 与 gateway 共存阶段）
  # ================================
  # ⚠️ 端口共存说明（重要）：
  #   gateway 当前监听 :8000（host 网络，容器直接占用宿主机端口）。
  #   entry 的监听端口不由镜像/本文件决定，而由本地引导配置
  #   data/entry/configs/config.yaml 的 server.http.addr 决定（默认 :8000）。
  #   - 若与 gateway 同时启动（T13 共存阶段）：必须先把 entry 引导配置的
  #     addr 改为 0.0.0.0:8003 —— :8001 已被 auth HTTP、:8002 已被 blog HTTP 占用，
  #     8000 是唯一空位冲突点；否则两个进程争抢 :8000，后启动者绑定失败。
  #   - T14 切换（gateway 退役）：从本文件删除 gateway 服务段，entry 引导配置
  #     恢复 0.0.0.0:8000，entry 即成为唯一 HTTP 入口。
  entry:
    image: ghcr.io/cyclezero/ley/ley-entry:latest
    container_name: ley-entry
    network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    depends_on:
      - auth
      - blog
