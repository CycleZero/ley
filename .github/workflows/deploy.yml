name: CD

on:
  push:
    branches: [main, master]
    paths:
      - 'api/**'
      - 'app/**'
      - 'pkg/**'
      - 'conf/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - 'runtime.Dockerfile'
      - 'docker-compose.yml'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: '部署目标'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  # =============================================================================
  # 构建后端 Docker 镜像并推送到 Harbor
  # =============================================================================
  build-backend:
    name: Build Backend Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # ---------- Auth 服务镜像 ----------
      - name: Build and push auth
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/auth/Dockerfile
          push: true
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/ley/ley-auth:latest
            ${{ secrets.HARBOR_REGISTRY }}/ley/ley-auth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GOPROXY=https://goproxy.cn,direct
            SERVICE_NAME=auth

      # ---------- Blog 服务镜像 ----------
      - name: Build and push blog
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/blog/Dockerfile
          push: true
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/ley/ley-blog:latest
            ${{ secrets.HARBOR_REGISTRY }}/ley/ley-blog:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GOPROXY=https://goproxy.cn,direct
            SERVICE_NAME=blog

      # ---------- Gateway 服务镜像 ----------
      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/ley/ley-gateway:latest
            ${{ secrets.HARBOR_REGISTRY }}/ley/ley-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # 构建前端静态文件
  # =============================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile

      - name: Generate static site
        working-directory: ./web
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE || 'https://api.blog.poyuan233.cn' }}
        run: pnpm generate

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/.output/public
          retention-days: 1

  # =============================================================================
  # 部署后端到后端服务器（Docker + Harbor）
  # =============================================================================
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-backend]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy backend via SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          COMPOSE_PROJECT: ${{ secrets.COMPOSE_PROJECT || '~/ley' }}
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          echo "=== 部署后端到 $SERVER_HOST ==="
          ssh -p $SERVER_PORT $SERVER_USER@$SERVER_HOST "
            set -e
            cd $COMPOSE_PROJECT

            echo '--- 拉取最新代码 ---'
            git pull origin main

            echo '--- 登录 Harbor ---'
            echo '$HARBOR_PASSWORD' | docker login $HARBOR_REGISTRY -u '$HARBOR_USERNAME' --password-stdin

            echo '--- 拉取 Harbor 镜像 ---'
            docker pull $HARBOR_REGISTRY/ley/ley-auth:${{ github.sha }}
            docker pull $HARBOR_REGISTRY/ley/ley-blog:${{ github.sha }}
            docker pull $HARBOR_REGISTRY/ley/ley-gateway:${{ github.sha }}

            echo '--- 重命名为本地标签 ---'
            docker tag $HARBOR_REGISTRY/ley/ley-auth:${{ github.sha }} ley-auth:latest
            docker tag $HARBOR_REGISTRY/ley/ley-blog:${{ github.sha }} ley-blog:latest
            docker tag $HARBOR_REGISTRY/ley/ley-gateway:${{ github.sha }} ley-gateway:latest

            echo '--- 重启服务 ---'
            docker-compose down
            docker-compose up -d

            echo '--- 清理旧镜像 ---'
            docker image prune -af --filter 'until=168h'

            echo '--- 后端部署完成 ---'
          "

      - name: Backend health check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "等待服务启动..."
          sleep 10
          curl -sf http://$SERVER_HOST:8000/api/v1/site/config || {
            echo "后端健康检查失败"
            exit 1
          }
          echo "后端健康检查通过"

  # =============================================================================
  # 部署前端到前端服务器（Nginx 静态文件）
  # =============================================================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-frontend]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend-dist

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FRONTEND_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}

      - name: Add frontend host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.FRONTEND_SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy frontend via SCP/SSH
        env:
          FRONTEND_HOST: ${{ secrets.FRONTEND_SERVER_HOST }}
          FRONTEND_USER: ${{ secrets.FRONTEND_SERVER_USER || secrets.SERVER_USER }}
          FRONTEND_PORT: ${{ secrets.FRONTEND_SERVER_PORT || secrets.SERVER_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.FRONTEND_DEPLOY_PATH || '/var/www/ley' }}
        run: |
          echo "=== 部署前端到 $FRONTEND_HOST ==="

          # 创建远程目录
          ssh -p $FRONTEND_PORT $FRONTEND_USER@$FRONTEND_HOST "mkdir -p $DEPLOY_PATH"

          # 使用 rsync 增量同步（删除旧文件，保留 Nginx 配置）
          rsync -avz --delete \
            -e "ssh -p $FRONTEND_PORT" \
            ./frontend-dist/ \
            $FRONTEND_USER@$FRONTEND_HOST:$DEPLOY_PATH/

          echo "--- 重载 Nginx ---"
          ssh -p $FRONTEND_PORT $FRONTEND_USER@$FRONTEND_HOST "sudo nginx -t && sudo systemctl reload nginx || sudo nginx -s reload"

          echo "--- 前端部署完成 ---"

      - name: Frontend health check
        env:
          FRONTEND_HOST: ${{ secrets.FRONTEND_SERVER_HOST }}
        run: |
          echo "等待前端生效..."
          sleep 3
          curl -sf http://$FRONTEND_HOST/ || {
            echo "前端健康检查失败"
            exit 1
          }
          echo "前端健康检查通过"
