name: CD

on:
  push:
    branches: [main, master]
    paths:
      - 'api/**'
      - 'app/**'
      - 'pkg/**'
      - 'conf/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - 'runtime.Dockerfile'
      - 'docker-compose.yml'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: '部署目标'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # =============================================================================
  # 构建并推送 Docker 镜像到 GitHub Container Registry
  # =============================================================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- Auth 服务镜像 ----------
      - name: Build and push auth
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/auth/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ley-auth:latest
            ${{ env.IMAGE_PREFIX }}/ley-auth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GOPROXY=https://goproxy.cn,direct
            SERVICE_NAME=auth

      # ---------- Blog 服务镜像 ----------
      - name: Build and push blog
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/blog/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ley-blog:latest
            ${{ env.IMAGE_PREFIX }}/ley-blog:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GOPROXY=https://goproxy.cn,direct
            SERVICE_NAME=blog

      # ---------- Gateway 服务镜像 ----------
      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/gateway/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ley-gateway:latest
            ${{ env.IMAGE_PREFIX }}/ley-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # 部署到远程服务器（通过 SSH）
  # =============================================================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 配置 SSH 密钥（需在仓库 Settings > Secrets and variables > Actions 中配置）
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # 部署脚本：服务器端拉取最新镜像并重启服务
      - name: Deploy via SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          COMPOSE_PROJECT: ${{ secrets.COMPOSE_PROJECT || '~/ley' }}
        run: |
          echo "=== 部署到 $SERVER_HOST ==="
          ssh -p $SERVER_PORT $SERVER_USER@$SERVER_HOST "
            set -e
            cd $COMPOSE_PROJECT
            echo '--- 拉取最新代码 ---'
            git pull origin main
            echo '--- 拉取最新镜像 ---'
            docker-compose pull
            echo '--- 重启服务 ---'
            docker-compose down
            docker-compose up -d
            echo '--- 清理旧镜像 ---'
            docker image prune -af --filter 'until=168h'
            echo '--- 部署完成 ---'
          "

      - name: Health check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "等待服务启动..."
          sleep 10
          curl -sf http://$SERVER_HOST:8000/api/v1/site/config || {
            echo "健康检查失败"
            exit 1
          }
          echo "健康检查通过"
