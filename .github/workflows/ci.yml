name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'api/**'
      - 'app/**'
      - 'pkg/**'
      - 'conf/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - 'runtime.Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/**'
  workflow_dispatch:

  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # 后端：编译 + 单元测试
  # =============================================================================
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '25.3'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install protoc plugins & wire
        run: make init

      - name: Generate proto code
        run: make api config internal_proto

      - name: Run Wire dependency injection
        run: make wire

      - name: Run unit tests
        run: make test-unit

      - name: Build backend services
        run: make build && make build-gateway

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

  # =============================================================================
  # 前端：安装依赖 + 生产构建
  # =============================================================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./web
        run: pnpm build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
          retention-days: 7

  # =============================================================================
  # Docker：镜像构建检查（不推送，仅验证 Dockerfile 是否可用）
  # =============================================================================
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image (ley-builder:v1)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ley-builder:v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GOPROXY=https://proxy.golang.org,direct

      - name: Build runtime image (ley-runtime:v1)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./runtime.Dockerfile
          push: false
          tags: ley-runtime:v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build auth image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/auth/Dockerfile
          push: false
          tags: ley-auth:ci
          cache-from: type=gha
          build-args: |
            GOPROXY=https://proxy.golang.org,direct

      - name: Build blog image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/blog/Dockerfile
          push: false
          tags: ley-blog:ci
          cache-from: type=gha
          build-args: |
            GOPROXY=https://proxy.golang.org,direct

      - name: Build gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/gateway/Dockerfile
          push: false
          tags: ley-gateway:ci
          cache-from: type=gha
          build-args: |
            GOPROXY=https://proxy.golang.org,direct

      - name: Build entry image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/entry/Dockerfile
          push: false
          tags: ley-entry:ci
          cache-from: type=gha
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
