name: CD - Backend

on:
  push:
    branches: [main, master]
    paths:
      - 'api/**'
      - 'app/**'
      - 'pkg/**'
      - 'conf/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - 'runtime.Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: '部署目标'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  # =============================================================================
  # 构建后端 Docker 镜像并推送到 GitHub Container Registry (GHCR)
  #
  # 基础镜像（ley-builder / ley-runtime）与服务镜像（ley-auth/blog/gateway/entry）
  # 全部托管在 ghcr.io/cyclezero/ley/。服务器部署时从 GHCR 直接 pull
  # （无需 Harbor，也无需服务器本地构建）。
  # =============================================================================
  build-backend:
    name: Build Backend Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GHCR 使用 GHCR_PAT（用户级 PAT）而非 GITHUB_TOKEN：
      # GITHUB_TOKEN（repo installation）无权在用户空间创建 ghcr.io/cyclezero/ 包
      # （报错 "installation not allowed to Create organization package"）。
      # GHCR_PAT 需 write:packages 权限（同时覆盖 read，服务器 pull 复用同一 PAT）。
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: CycleZero
          password: ${{ secrets.GHCR_PAT }}

      # ---------- Auth 服务镜像 ----------
      - name: Build and push auth
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/auth/Dockerfile
          push: true
          tags: |
            ghcr.io/cyclezero/ley/ley-auth:latest
            ghcr.io/cyclezero/ley/ley-auth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            SERVICE_NAME=auth
          build-contexts: |
            ley-builder:v1=docker-image://ghcr.io/cyclezero/ley/ley-builder:latest
            ley-runtime:v1=docker-image://ghcr.io/cyclezero/ley/ley-runtime:latest

      # ---------- Blog 服务镜像 ----------
      - name: Build and push blog
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/blog/Dockerfile
          push: true
          tags: |
            ghcr.io/cyclezero/ley/ley-blog:latest
            ghcr.io/cyclezero/ley/ley-blog:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            SERVICE_NAME=blog
          build-contexts: |
            ley-builder:v1=docker-image://ghcr.io/cyclezero/ley/ley-builder:latest
            ley-runtime:v1=docker-image://ghcr.io/cyclezero/ley/ley-runtime:latest

      # ---------- Entry 入口服务镜像（T13 共存期随后端发布，T14 切换后接替 gateway） ----------
      - name: Build and push entry
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/entry/Dockerfile
          push: true
          tags: |
            ghcr.io/cyclezero/ley/ley-entry:latest
            ghcr.io/cyclezero/ley/ley-entry:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
          build-contexts: |
            ley-builder:v1=docker-image://ghcr.io/cyclezero/ley/ley-builder:latest
            ley-runtime:v1=docker-image://ghcr.io/cyclezero/ley/ley-runtime:latest

  # =============================================================================
  # 部署后端到后端服务器（从 GHCR 拉取镜像）
  # =============================================================================
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-backend]
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p ${{ secrets.SERVER_PORT || '2366' }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy backend via SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '2366' }}
          COMPOSE_PROJECT: ${{ secrets.COMPOSE_PROJECT || '/projects/ley' }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          echo "=== 部署后端到 $SERVER_HOST ==="
          ssh -p $SERVER_PORT $SERVER_USER@$SERVER_HOST "
            set -e
            cd $COMPOSE_PROJECT

            echo '--- 拉取最新代码 ---'
            git pull origin master

            echo '--- 登录 GHCR ---'
            echo '$GHCR_PAT' | docker login ghcr.io -u CycleZero --password-stdin

            echo '--- 拉取指定版本镜像 ---'
            docker pull ghcr.io/cyclezero/ley/ley-auth:${{ github.sha }}
            docker pull ghcr.io/cyclezero/ley/ley-blog:${{ github.sha }}
            docker pull ghcr.io/cyclezero/ley/ley-entry:${{ github.sha }}

            echo '--- 标记为 compose 引用的 latest ---'
            docker tag ghcr.io/cyclezero/ley/ley-auth:${{ github.sha }} ghcr.io/cyclezero/ley/ley-auth:latest
            docker tag ghcr.io/cyclezero/ley/ley-blog:${{ github.sha }} ghcr.io/cyclezero/ley/ley-blog:latest
            docker tag ghcr.io/cyclezero/ley/ley-entry:${{ github.sha }} ghcr.io/cyclezero/ley/ley-entry:latest

            echo '--- 重启服务（T14：entry 为唯一 HTTP 入口，gateway 已退役）---'
            docker compose -f /projects/ley/docker-compose.yml down
            docker compose -f /projects/ley/docker-compose.yml up -d entry auth blog

            echo '--- 清理旧镜像 ---'
            docker image prune -af --filter 'until=168h'

            echo '--- 后端部署完成 ---'
          "

      - name: Backend health check
        run: |
          echo "等待服务启动..."
          sleep 10
          curl -sf https://api.blog.poyuan233.cn/api/v1/site/config || {
            echo "后端健康检查失败"
            exit 1
          }
          echo "后端健康检查通过"
