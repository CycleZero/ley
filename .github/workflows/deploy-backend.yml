name: CD - Backend

on:
  push:
    branches: [main, master]
    paths:
      - 'api/**'
      - 'app/**'
      - 'pkg/**'
      - 'conf/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - 'runtime.Dockerfile'
      - 'docker-compose.yml'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: '部署目标'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  # =============================================================================
  # 构建后端 Docker 镜像并推送到 Harbor
  #
  # 基础镜像（ley-builder / ley-runtime）托管在 GitHub Container Registry，
  # 利用 GitHub Actions 同机房内网极速拉取，无需走服务器出口带宽。
  # 服务镜像构建后推送到 Harbor，服务器本地 pull 零外网 IO。
  # =============================================================================
  build-backend:
    name: Build Backend Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Allow insecure Harbor registry
        run: |
          sudo mkdir -p /etc/docker
          echo "{\"insecure-registries\":[\"${{ secrets.HARBOR_REGISTRY }}\"]}" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker || sudo service docker restart

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config: |
            [registry."${{ secrets.HARBOR_REGISTRY }}"]
              http = true
              insecure = true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # ---------- Auth 服务镜像 ----------
      - name: Build and push auth
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/auth/Dockerfile
          push: true
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/ley/ley-auth:latest
            ${{ secrets.HARBOR_REGISTRY }}/ley/ley-auth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GOPROXY=https://goproxy.cn,direct
            SERVICE_NAME=auth
          build-contexts: |
            ley-builder:v1=docker-image://ghcr.io/cyclezero/ley/ley-builder:latest
            ley-runtime:v1=docker-image://ghcr.io/cyclezero/ley/ley-runtime:latest

      # ---------- Blog 服务镜像 ----------
      - name: Build and push blog
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/blog/Dockerfile
          push: true
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/ley/ley-blog:latest
            ${{ secrets.HARBOR_REGISTRY }}/ley/ley-blog:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GOPROXY=https://goproxy.cn,direct
            SERVICE_NAME=blog
          build-contexts: |
            ley-builder:v1=docker-image://ghcr.io/cyclezero/ley/ley-builder:latest
            ley-runtime:v1=docker-image://ghcr.io/cyclezero/ley/ley-runtime:latest

      # ---------- Gateway 服务镜像 ----------
      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/ley/ley-gateway:latest
            ${{ secrets.HARBOR_REGISTRY }}/ley/ley-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-contexts: |
            ley-builder:v1=docker-image://ghcr.io/cyclezero/ley/ley-builder:latest
            ley-runtime:v1=docker-image://ghcr.io/cyclezero/ley/ley-runtime:latest

  # =============================================================================
  # 部署后端到后端服务器（Docker + Harbor）
  # =============================================================================
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-backend]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy backend via SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '2366' }}
          COMPOSE_PROJECT: ${{ secrets.COMPOSE_PROJECT || '/projects/ley' }}
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          echo "=== 部署后端到 $SERVER_HOST ==="
          ssh -p $SERVER_PORT $SERVER_USER@$SERVER_HOST "
            set -e
            cd $COMPOSE_PROJECT

            echo '--- 拉取最新代码 ---'
            git pull origin main

            echo '--- 登录 Harbor ---'
            echo '$HARBOR_PASSWORD' | docker login $HARBOR_REGISTRY -u '$HARBOR_USERNAME' --password-stdin

            echo '--- 拉取 Harbor 镜像 ---'
            docker pull $HARBOR_REGISTRY/ley/ley-auth:${{ github.sha }}
            docker pull $HARBOR_REGISTRY/ley/ley-blog:${{ github.sha }}
            docker pull $HARBOR_REGISTRY/ley/ley-gateway:${{ github.sha }}

            echo '--- 重命名为本地标签 ---'
            docker tag $HARBOR_REGISTRY/ley/ley-auth:${{ github.sha }} ley-auth:latest
            docker tag $HARBOR_REGISTRY/ley/ley-blog:${{ github.sha }} ley-blog:latest
            docker tag $HARBOR_REGISTRY/ley/ley-gateway:${{ github.sha }} ley-gateway:latest

            echo '--- 重启服务 ---'
            docker compose -f /projects/ley/docker-compose.yml down
            docker compose -f /projects/ley/docker-compose.yml up -d

            echo '--- 清理旧镜像 ---'
            docker image prune -af --filter 'until=168h'

            echo '--- 后端部署完成 ---'
          "

      - name: Backend health check
        run: |
          echo "等待服务启动..."
          sleep 10
          curl -sf https://api.blog.poyuan233.cn/api/v1/site/config || {
            echo "后端健康检查失败"
            exit 1
          }
          echo "后端健康检查通过"
