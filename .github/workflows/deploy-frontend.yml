name: CD - Frontend

on:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: '部署目标'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  # =============================================================================
  # 构建前端静态文件
  # =============================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile

      - name: Generate static site
        working-directory: ./web
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE || 'https://api.blog.poyuan233.cn' }}
        run: pnpm generate

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/.output/public
          retention-days: 1

  # =============================================================================
  # 部署前端到前端服务器（Nginx 静态文件）
  # =============================================================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-frontend]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend-dist

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FRONTEND_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}

      - name: Add frontend host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.FRONTEND_SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy frontend via rsync
        env:
          FRONTEND_HOST: ${{ secrets.FRONTEND_SERVER_HOST }}
          FRONTEND_USER: ${{ secrets.FRONTEND_SERVER_USER || secrets.SERVER_USER }}
          FRONTEND_PORT: ${{ secrets.FRONTEND_SERVER_PORT || secrets.SERVER_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.FRONTEND_DEPLOY_PATH || '/www/wwwroot/blog.poyuan233.cn' }}
        run: |
          echo "=== 部署前端到 $FRONTEND_HOST ==="

          # 创建远程目录
          ssh -p $FRONTEND_PORT $FRONTEND_USER@$FRONTEND_HOST "mkdir -p $DEPLOY_PATH"

          # 使用 rsync 增量同步（--no-perms 避免宝塔文件权限冲突，排除 .user.ini 宝塔保护文件）
          rsync -rlvz --delete --no-perms \
            --exclude='.user.ini' \
            -e "ssh -p $FRONTEND_PORT" \
            ./frontend-dist/ \
            $FRONTEND_USER@$FRONTEND_HOST:$DEPLOY_PATH/

          echo "--- 重载 Nginx (宝塔面板环境可忽略此步错误) ---"
          ssh -p $FRONTEND_PORT $FRONTEND_USER@$FRONTEND_HOST "sudo nginx -t 2>/dev/null && sudo systemctl reload nginx 2>/dev/null || true" || true

          echo "--- 前端部署完成 ---"

      - name: Frontend health check
        env:
          FRONTEND_HOST: ${{ secrets.FRONTEND_SERVER_HOST }}
        run: |
          echo "等待前端生效..."
          sleep 3
          curl -sf http://$FRONTEND_HOST/ || {
            echo "前端健康检查失败"
            exit 1
          }
          echo "前端健康检查通过"
