<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    .ley-stroke { stroke: #1a1a1a; }
    .ley-fill { fill: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      .ley-stroke { stroke: #e8e8e8; }
      .ley-fill { fill: #e8e8e8; }
    }
  </style>
  <!-- L 形小径：拐角处圆角，比例更纤细 -->
  <path
    class="ley-stroke"
    d="M8 5 L8 16 L17 16"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- 起点标记：小圆点，位于拐角左外侧，避免与路径连成三角形轮廓 -->
  <circle
    class="ley-fill"
    cx="5"
    cy="16"
    r="1.3"
  />
</svg>
