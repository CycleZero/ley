<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    .ley { stroke: #1a1a1a; fill: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      .ley { stroke: #e8e8e8; fill: #e8e8e8; }
    }
  </style>
  <!-- L 形小径 -->
  <path class="ley" d="M7 6 L7 17 L17 17" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
